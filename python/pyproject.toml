[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syslab"
version = "0.1.0"
description = "Systems fundamentals lab: LRU/TTL cache and rate limiters, with failure injection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []  # standard library only at runtime

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["syslab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
